[package]
name = "gitlab-rs-runner"
version = "0.1.0"
edition = "2021"
description = "Drop-in GitLab Runner 19.3.1 replacement in Rust"
license = "MIT"

[[bin]]
name = "gitlab-runner"
path = "src/main.rs"

[lib]
name = "gitlab_rs_runner"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bollard = "0.18"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
